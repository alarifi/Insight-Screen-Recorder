name: Bug report
description: Report a reproducible recorder issue.
title: "[Bug]: "
body:
  - type: input
    id: environment
    attributes:
      label: App version and Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include selected devices and which media sources were enabled.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reviewed diagnostic details
      description: Remove personal paths, license keys, private screen/audio content and confidential logs before posting.
